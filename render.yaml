# Render Blueprint - Essential (Social Media Super Agent)
# Spec: https://render.com/docs/blueprint-spec
#
# Provisions 4 resources, wired together automatically:
#   essential-redis   Key Value (Redis) - BullMQ queue backend
#   essential-db      PostgreSQL       - drafts, auth, approvals, OAuth tokens
#   essential-api     Web Service      - Fastify HTTP API (apps/api/server.ts)
#   essential-worker  Background Worker - BullMQ processor (apps/worker/server.ts)
#
# BEFORE YOU DEPLOY:
#   1. REGION: every `region:` below must match. Options: oregon, ohio,
#      virginia, frankfurt, singapore. Set to `virginia` here.
#   2. EXISTING REDIS: if you already created a Key Value instance by hand,
#      delete it after this blueprint applies - this file provisions its own.
#   3. The entrypoints read DATABASE_URL / REDIS_URL first (packages/core/
#      db-config.ts), so the blueprint injects Render's internal connection
#      strings directly. Postgres SSL is enabled automatically when
#      DATABASE_URL is set; add DATABASE_SSL=false only if a connection fails
#      the TLS handshake.
#   4. LIVE_PUBLISH stays "false". Flip to "true" only after the M6
#      test-account pass - server.ts refuses to boot in live mode with the
#      generated-but-unreviewed secrets left as placeholders.

databases:
  - name: essential-db
    databaseName: essential
    user: essential
    plan: basic-256mb
    region: virginia

services:
  - type: keyvalue
    name: essential-redis
    plan: starter
    region: virginia
    maxmemoryPolicy: noeviction   # BullMQ job data must never be evicted
    ipAllowList: []               # internal connections only, no public access

  - type: web
    name: essential-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: LIVE_PUBLISH
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: essential-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: essential-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: TOOL_VAULT_KEY
        generateValue: true
      - key: PASSWORD_MIN_LENGTH
        value: "8"
      - key: PASSWORD_REQUIRE_SPECIAL
        value: "true"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: REMEMBER_USERNAME_ENABLED
        value: "true"
      - key: POLLINATIONS_ENABLED
        value: "true"

  - type: worker
    name: essential-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npx tsx apps/worker/server.ts
    plan: starter
    region: virginia
    autoDeploy: true
    envVars:
      - key: LIVE_PUBLISH
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: essential-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: essential-redis
          property: connectionString
